name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo; no job needs write access.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: install dependencies
        run: dnf install -y git ShellCheck python3 make

      - uses: actions/checkout@v7

      - name: lint all scripts
        run: make lint

      - name: unit and behavioral regression tests (no real Podman)
        run: make test

  integration:
    # A VM is required: nested rootless Podman is unavailable in the lint container.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install rootless Podman dependencies
        run: sudo apt-get update && sudo apt-get install -y podman crun uidmap slirp4netns

      - name: podman info
        run: podman version && podman info --format 'rootless={{.Host.Security.Rootless}}'

      - name: wrapper suite across the supported distro images
        # One VM, all major distros: Podman pulls each image regardless of host,
        # so a single runner covers the full set. Aliases (opensuse/suse/leap/
        # tumbleweed) resolve to these same images and are unit-tested, so they
        # are omitted here to avoid redundant pulls. Fail the first failing run;
        # whole-suite retries can conceal regressions.
        env:
          TOOLBOXER_TEST_DISTROS: "fedora rhel centos arch opensuse-leap opensuse-tumbleweed debian:12 rocky:9 ubuntu:jammy"
        run: timeout -k 30 1800 ./tests/test_toolboxer.sh

      - name: isolation, workdir, concurrency, and integrated-runtime regressions
        run: timeout -k 30 600 ./tests/test_isolation.sh
